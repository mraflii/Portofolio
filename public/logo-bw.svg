<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Elegant Metallic Black, White, and Silver Gradient -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#9CA3AF"/>
      <stop offset="60%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    
    <!-- Subtle dual shadow to ensure visibility on both light and dark browser tabs -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g fill="none" stroke="url(#grad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <!-- The "M" -->
    <path d="M 14 80 L 14 20 L 39 52 L 64 20 L 64 80" />
    
    <!-- The "R", extending from the right side of the M seamlessly -->
    <path d="M 64 20 C 94 20, 94 52, 64 52 L 84 80" />
  </g>
</svg>
